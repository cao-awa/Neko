kotlin.code.style=official

# The IDE platform ships the Kotlin standard library -- `util-8.jar` carries ~1000 `kotlin/*`
# classes, `kotlin/jvm/internal/Intrinsics` among them -- and the NekoJ plugin runs inside it. So the
# Kotlin plugin must not add the standard library to a module's `implementation` configuration by
# itself: the plugin would ship a second copy that shadows the platform's, which
# `verifyPluginProjectConfiguration` rejects as a bundled runtime conflict.
#
# Each module therefore states the need itself: `neko` declares `implementation(kotlin("stdlib"))`
# because it runs on a plain JVM, while `plugin/idea` declares `compileOnly(kotlin("stdlib"))`
# because at run time the IDE it is loaded into already provides one.
kotlin.stdlib.default.dependency=false

# ---------------------------------------------------------------------------- Neko sources
#
# Neko compiles a *program*, not a file: a class in one file may name a class declared in another. So
# the build is told which directories hold sources, and every `.neko` file found under them is
# compiled in one run — no individual file is ever listed in `build.gradle.kts`. Adding a source file
# means adding it to a directory.
#
# There *is* a standard library again, but it is not listed here: `stdlib/` is compiled by the
# compiler itself, ahead of every program, and its sources ship inside the compiler's jar. Listing it
# as a source directory would compile it twice — once by the build, once by the compiler — and would
# make a program's build depend on a directory that the jar does not carry.
#
# The iteration protocol `for ... in` uses is the JDK's own `java.lang.Iterable`/`java.util.Iterator`,
# so Neko's library holds only what the language cannot borrow.
#
# Directories are relative to the *root* project directory and are searched recursively, so a file's
# location inside one is a matter of tidiness rather than of resolution: a package is declared by the
# file's own `locate` line.
neko.sourceDirectories=samples/com/github/kusa233/neko/sample

# The Neko standard library, relative to the root project directory.
#
# Not a source directory: the compiler prepends it to every compilation itself, so a program never
# names it and a reader never has to pass it on the command line. It is configured here so the build
# knows what to package into the compiler's resources, and so the path lives with the other paths.
neko.standardLibraryDirectory=stdlib

# Where the compiled `.class` files are written, relative to the root project directory.
neko.outputDirectory=neko-compile/classes

# The class the `runNeko` task runs when no program is named with -Pneko.program.
neko.mainClass=com.github.kusa233.neko.sample.effect.Test
