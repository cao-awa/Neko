kotlin.code.style=official

# ---------------------------------------------------------------------------- Neko sources
#
# Neko compiles a *program*, not a file: a class in one file may name a class declared in another,
# and the standard library that `raise` lowers to is itself written in Neko. So the build is told
# which directories hold sources, and every `.neko` file found under them is compiled in one run — no
# individual file is ever listed in `build.gradle.kts`. Adding a source file means adding it to a
# directory.
#
# The standard library is configured separately from the programs because the two play different
# roles: `neko.libraryDirectories` is what every program compiles against, while
# `neko.sourceDirectories` holds the programs themselves. Both are compiled together, so the
# distinction is about intent, not about the class files that come out.
#
# Directories are relative to the *root* project directory and are searched recursively, so a file's
# location inside one is a matter of tidiness rather than of resolution: a package is declared by the
# file's own `locate` line.
neko.libraryDirectories=stdlib
neko.sourceDirectories=samples/com/github/kusa233/neko/sample

# Where the compiled `.class` files are written, relative to the root project directory.
neko.outputDirectory=neko-compile/classes

# The class the `runNeko` task runs when no program is named with -Pneko.program.
neko.mainClass=com.github.kusa233.neko.sample.Sample
